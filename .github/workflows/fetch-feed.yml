name: Fetch SITREP RSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch RSS feed
        run: |
          curl --fail --location --silent --show-error \
            'https://script.google.com/macros/s/AKfycbz9Ov2hxvfUNPixCtdWUyU4SiVwBKAkbkD9MiBeow4v1PTFtOV5hI7GP67CHG2OwtnmwQ/exec' \
            --output feed.xml

      - name: Verify feed
        run: |
          set -euo pipefail
          test -s feed.xml
          grep -q '<title>Will Self — SITREP Archive</title>' feed.xml

          COUNT=$(grep -o '<item>' feed.xml | wc -l | tr -d ' ')
          echo "SITREP items found: $COUNT"

          if [ "$COUNT" -lt 21 ]; then
            echo "Feed unexpectedly contains fewer than the original 21 SITREPs."
            exit 1
          fi

          LATEST_GUID=$(grep -o '<guid isPermaLink="false">[^<]*</guid>' feed.xml | tail -1 | sed -E 's#</?guid[^>]*>##g')
          LATEST_TITLE=$(grep -o '<title>[^<]*</title>' feed.xml | tail -1 | sed -E 's#</?title>##g')
          echo "Latest GUID: $LATEST_GUID"
          echo "Latest title: $LATEST_TITLE"

          printf '%s\n' "$COUNT" > sitrep-count.txt
          printf '%s\n' "$LATEST_GUID" > latest-guid.txt
          printf '%s\n' "$LATEST_TITLE" > latest-title.txt

      - name: Commit refreshed feed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add feed.xml sitrep-count.txt latest-guid.txt latest-title.txt

          if git diff --cached --quiet; then
            echo 'No feed changes to commit.'
            exit 0
          fi

          git commit -m 'Refresh SITREP RSS feed'

          git pull --rebase origin main
          git push origin HEAD:main
